name: Publish the stats dashboard

# Every night after the day closes (00:15 Helsinki in winter, 01:15 in summer), plus a manual "Run workflow" button.
# Rebuilds the marimo notebook in dashboard/ with fresh data and uploads it to Cloudflare Pages, behind Cloudflare
# Access. The bot itself is never touched. Setup steps are in dashboard/README.md.
on:
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:

concurrency:
  group: dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Snapshot, export and deploy
    env:
      # A separate token with only "Cloudflare Pages: Edit" and "D1: Read", so the bot's own token stays narrow.
      CLOUDFLARE_API_TOKEN: ${{ secrets.DASHBOARD_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Until the token exists, skip quietly instead of failing every night.
      - name: Check setup
        id: setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::DASHBOARD_API_TOKEN isn't set yet, so there's nothing to publish. See dashboard/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22

      # For wrangler, which snapshot.py and the deploy use.
      - name: Install dependencies
        if: steps.setup.outputs.ready == 'true'
        run: npm ci

      - uses: astral-sh/setup-uv@v6
        if: steps.setup.outputs.ready == 'true'

      - name: Snapshot the database
        if: steps.setup.outputs.ready == 'true'
        working-directory: dashboard
        run: uv run snapshot.py

      - name: Export the notebook
        if: steps.setup.outputs.ready == 'true'
        working-directory: dashboard
        run: |
          uv run marimo export html-wasm dashboard.py -o site --mode run
          # marimo adds a generic CLAUDE.md to every export; it doesn't belong on the site.
          rm -f site/CLAUDE.md

      # The Pages project is created by hand, with Access set up before the first upload (dashboard/README.md),
      # so this never makes a public site by itself: it fails if the project doesn't exist yet.
      - name: Deploy to Cloudflare Pages
        if: steps.setup.outputs.ready == 'true'
        run: npx wrangler pages deploy dashboard/site --project-name dailybotti-dashboard --branch main --commit-dirty=true

      # Tells the bot when the dashboard was last published, for its /dashboard command. Uses the bot's own token,
      # since the dashboard token can only read D1; it writes this one settings row and nothing else.
      - name: Record the publish time for the bot
        if: steps.setup.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          npx wrangler d1 execute daily-games-bot --remote --command \
            "INSERT INTO settings (key, value) VALUES ('dashboard_updated_at', '$now') ON CONFLICT(key) DO UPDATE SET value = excluded.value"
